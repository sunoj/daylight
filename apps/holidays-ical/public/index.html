<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>昼间 · 节假日 iCal</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.6 -apple-system, "PingFang SC", system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1.25rem; }
  h1 { font-size: 1.5rem; letter-spacing: -0.01em; }
  code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; background: color-mix(in srgb, currentColor 8%, transparent); padding: 0.1em 0.35em; border-radius: 4px; }
  ul { padding-left: 1.1rem; }
  .muted { opacity: 0.65; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>昼间 · 法定节假日 iCal</h1>
  <p>为「昼间」日历插件提供节假日订阅源，可被任意支持 iCal 的日历订阅。</p>
  <p>仅托管没有官方源的地区（目前只有中国大陆）；有官方/推荐源的地区由客户端直接订阅。</p>
  <ul>
    <li>中国大陆：<code>/cn.ics</code> — 源自 <a href="https://github.com/NateScarlet/holiday-cn">holiday-cn</a>（国务院办公厅公告），仅含放假日。</li>
    <li>中国香港：GovHK 官方 <code>1823.gov.hk/common/ical/tc.ics</code>（客户端直连）。</li>
    <li>泰国：<code>officeholidays.com/ics/thailand</code>（客户端直连）。</li>
  </ul>
  <p class="muted">缓存约 24 小时。<code>/cn</code> 与 <code>/cn.ics</code> 均可访问。</p>
</body>
</html>
